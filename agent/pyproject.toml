[project]
name = "ponte"
version = "0.1.0"
description = "Controle seu PC pelo celular: voz, tela ao vivo, mouse, teclado e agente de IA"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115","uvicorn>=0.30","websockets>=13.0","pyautogui>=0.9.54","mss>=9.0","pillow>=10.0","psutil>=5.9","pyperclip>=1.9","qrcode>=7.4"]

[project.optional-dependencies]
ia = ["anthropic>=1.0"]

[project.scripts]
ponte = "ponte.server:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ponte = ["static/*"]
